[package]
name = "hexalyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rfd.workspace = true
same-file.workspace = true
intelhexlib.workspace = true
# Bundle the emoji fonts (e.g. for the error icon): egui doesn't include them by default
# and Windows has no system font fallback
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
# On Windows: use lightweight 'glow' (OpenGL) backend
[target.'cfg(windows)'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow", "clipboard", "links"] }
# On Mac/Linux: use 'default' features
[target.'cfg(not(windows))'.dependencies]
eframe = { workspace = true, features = ["default"] }

[build-dependencies]
winresource = "0.1.34"

[package.metadata.packager]
product_name = "Hexalyzer"
identifier = "com.github.iharhl.hexalyzer"
description = "IntelHex viewer and editor app"
# Shown in the macOS About window and the Windows file properties
copyright = "Copyright © 2026 Ihar Hlukhau. MIT License."
# Desktop menu section on Linux / App Store category on macOS
category = "DeveloperTool"
# Builds the app, so only `cargo packager --release` needed
before-packaging-command = "cargo build --release --locked -p hexalyzer"
# Icons for MacOS, Windows and a fallback PNG
icons = ["assets/icon.icns", "assets/icon.ico", "assets/icon_128x128_win.png"]

[package.metadata.packager.macos]
# Extra Info.plist keys, see the comment in the file
info-plist-path = "assets/Info.plist"
# Ad-hoc signature does not require Apple Developer ID. Without it, only the binary is
# signed (by the linker) and not the bundle, so macOS calls the downloaded app "damaged".
# With it, macOS shows the regular unverified-developer warning which can be "Open Anyway".
signing-identity = "-"

[package.metadata.packager.nsis]
# Installs into %LOCALAPPDATA%\Hexalyzer, no admin rights are needed
installer_mode = "currentUser"
