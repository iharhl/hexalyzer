[workspace]
members = [
    "intelhexlib",
    "hexalyzer",
]
default-members = ["hexalyzer"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Ihar Hlukhau | ihluk@outlook.com"]
license = "MIT"
description = "Intel HEX parser & hex viewer GUI"
repository = "https://github.com/iharhl/hexalyzer"

[workspace.dependencies]
intelhexlib = { path = "intelhexlib" }
eframe = { version = "0.37.0", default-features = false }
egui = { version = "0.37.0", default-features = false }
rfd = "0.18.0"
same-file = "1.0.6"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
