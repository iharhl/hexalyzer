name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and packages everything without making a release.
  # The files can be downloaded from the run's summary page.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same format / clippy / test jobs as for pull requests
  checks:
    name: Checks
    uses: ./.github/workflows/default.yaml

  version:
    name: Check version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install

      # The tag must match the crate versions (shared via the workspace), so the files get the right names
      - name: Compare tag with crate versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for pkg in hexalyzer intelhexlib; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg pkg "$pkg" '.packages[] | select(.name == $pkg) | .version')
            if [[ "$version" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $pkg version $version"
              status=1
            fi
          done
          exit $status

  build:
    name: Build (${{ matrix.platform }})
    needs: [checks, version]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only (arm64 GitHub's macOS runners)
          - os: macos-latest
            platform: macos-arm64
            formats: dmg
            installers: "*.dmg"
          - os: windows-latest
            platform: windows-x86_64
            formats: nsis
            installers: "*-setup.exe"
          # The oldest available Ubuntu, so the app runs on distros with an older glibc
          - os: ubuntu-22.04
            platform: linux-x86_64
            formats: deb,appimage
            installers: "*.deb *.AppImage"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Headers needed to build the GUI (eframe / winit / rfd) on Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # Builds the app via `before-packaging-command` in hexalyzer/Cargo.toml, then bundles it.
      # A fresh output folder keeps leftovers from cached builds out of the release.
      - name: Build and package app
        working-directory: hexalyzer
        run: |
          mkdir -p ../packages
          cargo packager --release --formats ${{ matrix.formats }} --out-dir ../packages

      - name: Build CLI
        run: cargo build -p intelhexlib --features cli --release --locked

      # Installers keep cargo-packager's names (app, version, architecture);
      # the CLI is archived so it keeps its executable bit, and named after the platform.
      - name: Collect release files
        run: |
          version=$(cargo pkgid -p intelhexlib | sed 's/.*[#@]//')
          cli="hexcli_${version}_${{ matrix.platform }}"
          mkdir dist
          (cd packages && cp ${{ matrix.installers }} ../dist/)
          cd target/release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "../../dist/$cli.zip" hexcli.exe
          else
            tar -czf "../../dist/$cli.tar.gz" hexcli
          fi
          ls -l ../../dist

      - uses: actions/upload-artifact@v7
        with:
          name: hexalyzer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Lets users check their download, e.g. `shasum -a 256 -c SHA256SUMS.txt --ignore-missing`
      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # Reuses the release if one already exists for this tag, otherwise creates a draft
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
