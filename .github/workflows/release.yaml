name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same format / clippy / test jobs as for pull requests
  checks:
    name: Checks
    uses: ./.github/workflows/default.yaml

  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install

      # The tag must match the crate versions (shared via the workspace), so the files get the right names
      - name: Compare tag with crate versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for pkg in hexalyzer intelhexlib; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg pkg "$pkg" '.packages[] | select(.name == $pkg) | .version')
            if [[ "$version" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $pkg version $version"
              status=1
            fi
          done
          exit $status

  build:
    name: Build (${{ matrix.os }})
    needs: [checks, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            zip: MacInstallerAndCLI
            format: dmg
            installer: "*.dmg"
            cli: hexcli
          - os: windows-latest
            zip: WinInstallerAndCLI
            format: nsis
            installer: "*-setup.exe"
            cli: hexcli.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # Builds the app via `before-packaging-command` in hexalyzer/Cargo.toml, then bundles it
      - name: Build and package app
        working-directory: hexalyzer
        run: cargo packager --release --formats ${{ matrix.format }}

      - name: Build CLI
        run: cargo build -p intelhexlib --features cli --release --locked

      # One ZIP per platform with the installer and the CLI, as in earlier releases
      - name: Create ZIP
        run: |
          name="${{ matrix.zip }}_${GITHUB_REF_NAME}.zip"
          mkdir dist
          cd target/release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "../../dist/$name" ${{ matrix.installer }} ${{ matrix.cli }}
          else
            zip "../../dist/$name" ${{ matrix.installer }} ${{ matrix.cli }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Lets users check their download, e.g. `shasum -a 256 -c SHA256SUMS.txt --ignore-missing`
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt

      # Reuses the release if one already exists for this tag, otherwise creates a draft
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
